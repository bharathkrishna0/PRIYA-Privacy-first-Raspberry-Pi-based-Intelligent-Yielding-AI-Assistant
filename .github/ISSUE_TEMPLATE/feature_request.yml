name: Feature request
description: Suggest a new command or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that PRIYA cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Example Hindi phrases and the expected reply or action.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: Works offline on a Raspberry Pi (no cloud API)
        - label: Does not need new heavyweight dependencies
